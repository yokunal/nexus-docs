<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nexus//friday — docs · paper-frame REV 5</title>
<script src="marked.min.js"></script>
<style>
  /* ═══════════ PALETTE — LOCKED, DO NOT CHANGE ═══════════ */
  :root{
    --bg:      #f7f0df;  /* cream */
    --panel:   #efe6cf;  /* shade */
    --shadow:  #e2d6ba;  /* deeper shade */
    --line:    #d9cdb2;  /* rule */
    --heading: #8a3324;  /* brick red */
    --dim:     #7a7365;  /* graphite */
    --green:   #2e6e4e;  /* phosphor */
    --ink:     #1c1a17;  /* ink */
    --font:"IBM Plex Mono", "Courier New", monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--font);
    background:var(--bg); color:var(--ink);
    line-height:1.6; font-size:14px;
    display:grid;
    grid-template-columns:225px 1fr;
    grid-template-rows:46px 1fr 32px;
    grid-template-areas:
      "titlebar  titlebar"
      "sidebar   viewport"
      "statusbar statusbar";
    height:100vh; overflow:hidden;
  }
  ::selection{background:var(--ink); color:var(--bg)}

  /* ── titlebar: window chrome ── */
  .titlebar{
    grid-area:titlebar;
    display:flex; align-items:center; gap:12px;
    background:var(--ink); color:var(--bg);
    padding:0 14px; border-bottom:2px solid var(--line);
  }
  .dots{display:flex; gap:6px}
  .dots span{width:10px; height:10px; border-radius:50%; background:var(--bg)}
  .dots span:nth-child(1){background:var(--heading)}
  .dots span:nth-child(2){background:var(--green)}
  .dots span:nth-child(3){background:transparent; border:1px solid var(--bg)}
  .path{font-size:12px; letter-spacing:1px; opacity:.9}
  .rev{
    margin-left:auto; font-size:10.5px; letter-spacing:2px;
    border:1px solid var(--bg); padding:2px 8px;
    animation:stampIn .4s ease .3s both;
  }
  /* ── sidebar ── */
  .sidebar{
    grid-area:sidebar;
    background:var(--bg);
    border-right:2px dashed var(--line);
    overflow-y:auto; padding:14px 0;
  }
  .sidebar .label{
    font-size:10.5px; letter-spacing:3px; color:var(--heading);
    padding:0 14px 10px; border-bottom:2px solid var(--line); margin-bottom:8px;
  }
  .sidebar nav a{
    display:block; padding:5px 14px; margin:1px 0;
    font-size:12.5px; color:var(--ink); text-decoration:none;
    border-left:3px solid transparent; cursor:pointer;
    transition:background .1s, border-color .1s, color .1s;
  }
  .sidebar nav a::before{content:"> "; color:var(--dim)}
  .sidebar nav a:hover{background:var(--shadow)}
  .sidebar nav a.active{
    background:var(--ink); color:var(--bg);
    border-left-color:var(--heading);
  }
  .sidebar nav a.active::before{content:"▶ "; color:var(--green)}
  /* ── viewport ── */
  .viewport{
    grid-area:viewport; overflow-y:auto;
    padding:36px 48px; position:relative;
    background:
      repeating-linear-gradient(0deg, transparent 0 27px, rgba(122,115,101,.06) 27px 28px),
      var(--bg);
  }
  .reg{position:absolute; color:var(--dim); font-size:11px; user-select:none}
  .reg.tl{top:8px; left:12px} .reg.tr{top:8px; right:12px}
  .reg.bl{bottom:6px; left:12px} .reg.br{bottom:6px; right:12px}
  .cursor{
    display:inline-block; width:9px; height:15px;
    background:var(--green); vertical-align:-2px;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  main{max-width:780px; animation:stampIn .3s ease both}
  @keyframes stampIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  /* ── markdown typography ── */
  main h1{font-size:1.55rem; letter-spacing:1px; padding-bottom:10px; margin-bottom:4px; border-bottom:2px solid var(--ink)}
  main h1 + p{margin-top:8px}
  main h2{font-size:1.08rem; color:var(--heading); letter-spacing:2px; margin:2rem 0 .6rem; display:flex; gap:10px; align-items:baseline}
  main h3{font-size:.95rem; color:var(--green); margin:1.3rem 0 .4rem; letter-spacing:1px}
  main p{margin:.5rem 0}
  main a{color:var(--heading); text-decoration:underline; text-underline-offset:3px}
  main strong{color:var(--heading)}
  main code{
    background:var(--panel); border:1px solid var(--line);
    padding:.08em .4em; font-size:.9em; color:var(--green);
  }
  main pre{
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--green);
    padding:12px 14px; overflow-x:auto; margin:.8rem 0; font-size:.88em;
    box-shadow:3px 3px 0 var(--shadow);
  }
  main pre code{border:0; padding:0; color:var(--ink); background:none}
  main blockquote{
    border-left:3px solid var(--heading); background:var(--panel);
    padding:10px 14px; margin:.8rem 0; font-style:italic; color:var(--dim);
  }
  main ul,main ol{margin:.5rem 0 .5rem 1.5rem}
  main li{margin:.2rem 0}
  main li::marker{color:var(--heading)}
  main table{border-collapse:collapse; width:100%; margin:.9rem 0; font-size:.9em}
  main th{background:var(--ink); color:var(--bg); letter-spacing:1px; font-size:.85em}
  main th,main td{border:1px solid var(--line); padding:6px 10px; text-align:left}
  main tr:nth-child(even) td{background:var(--panel)}
  main hr{
    border:0; height:8px; margin:1.8rem 0;
    background:repeating-linear-gradient(45deg, var(--line) 0 1px, transparent 1px 6px);
  }
  /* ── statusbar ── */
  .statusbar{
    grid-area:statusbar;
    display:flex; align-items:center; gap:16px;
    background:var(--bg); border-top:2px solid var(--ink);
    padding:0 14px; font-size:10.5px; letter-spacing:1.5px; color:var(--dim);
  }
  .lamp{
    width:8px; height:8px; border-radius:50%;
    background:var(--green);
    box-shadow:0 0 4px var(--green);
    animation:blink 2.4s steps(1) infinite;
  }
  .lamp b{color:var(--green)}
  .statusbar .right{margin-left:auto; letter-spacing:1px}
  .statusbar .right b{color:var(--heading)}
  /* ── 404 ── */
  main .nf{color:var(--heading); font-size:3rem; letter-spacing:6px}
  /* ── mobile & tablet: card-grid drawer menu design ── */
  @media(max-width:1024px){
    body{
      grid-template-columns:1fr;
      grid-template-rows:50px 1fr 32px;
      grid-template-areas:
        "titlebar"
        "viewport"
        "statusbar";
      height:100vh;
      overflow:hidden;
    }
    .titlebar{
      padding:0 14px;
      justify-content:space-between;
      z-index:100;
    }
    .titlebar .path::after{
      content:" ▾";
      color:var(--heading);
      font-weight:bold;
    }
    .rev{
      display:none;
    }
    /* transform sidebar into a sleek overlay drawer / modal menu */
    .sidebar{
      position:fixed;
      top:50px;
      left:0;
      width:100%;
      height:calc(100vh - 82px);
      background:var(--bg);
      border-right:0;
      border-bottom:3px solid var(--ink);
      z-index:99;
      padding:20px;
      box-shadow:0 12px 30px rgba(28,26,23,0.25);
      overflow-y:auto;
      display:none; /* toggled via JS class */
    }
    .sidebar.mobile-open{
      display:block;
      animation:stampIn .25s ease both;
    }
    .sidebar .label{
      font-size:11px;
      letter-spacing:3px;
      color:var(--heading);
      padding-bottom:12px;
      margin-bottom:14px;
      border-bottom:2px solid var(--heading);
    }
    .sidebar nav{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
      gap:8px;
    }
    .sidebar nav a{
      padding:12px 14px;
      font-size:13px;
      background:var(--panel);
      border:1px solid var(--line);
      border-left:4px solid var(--heading);
      border-radius:0;
      margin:0;
      transition:all .15s ease;
    }
    .sidebar nav a::before{
      content:"# ";
      color:var(--green);
    }
    .sidebar nav a:hover{
      background:var(--shadow);
    }
    .sidebar nav a.active{
      background:var(--ink);
      color:var(--bg);
      border-left-color:var(--green);
      box-shadow:3px 3px 0 var(--shadow);
    }
    .viewport{
      padding:24px 18px;
      overflow-y:auto;
    }
    .statusbar{
      font-size:10px;
      padding:0 12px;
      letter-spacing:1.2px;
    }
    .statusbar span:nth-child(2){
      display:none;
    }
  }

  @media(max-width:480px){
    .sidebar nav{
      grid-template-columns:1fr;
    }
    .viewport{
      padding:18px 14px;
    }
    main h1{
      font-size:1.3rem;
    }
  }
  @media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
  @media print{
    .titlebar,.sidebar,.statusbar,.reg{display:none}
    body{display:block; height:auto; overflow:visible; background:none}
    .viewport{overflow:visible; padding:0; background:none}
  }
</style>
</head>
<body>
<div class="titlebar">
  <div class="dots"><span></span><span></span><span></span></div>
  <span class="path">nexus://friday/docs — paper-frame</span>
  <span class="rev">REV 5</span>
</div>
<div class="sidebar">
  <div class="label">— INDEX —</div>
  <nav id="nav"></nav>
</div>
<div class="viewport">
  <span class="reg tl">+</span><span class="reg tr">+</span>
  <span class="reg bl">+</span><span class="reg br">+</span>
  <main id="content"><p style="color:var(--dim)">loading<span class="cursor"></span></p></main>
</div>
<div class="statusbar">
  <span class="lamp"></span>
  <span>ON-LINE</span>
  <span>handcrafted · <b>Friday</b> for <b>Boss</b></span>
  <span class="right">paper edition · est. 2025</span>
</div>
<script>
const PAGES = [
  {file:"overview.md",       label:"01 · Overview"},
  {file:"personality.md",    label:"02 · Personality"},
  {file:"architecture.md",   label:"03 · Architecture"},
  {file:"tools.md",          label:"04 · Tools"},
  {file:"workflows.md",      label:"05 · Workflows"},
  {file:"memory.md",         label:"06 · Memory"},
  {file:"subagents.md",      label:"07 · Subagents"},
  {file:"plugins.md",        label:"08 · Plugins"},
  {file:"error-handling.md", label:"09 · Errors"},
  {file:"storage-spec.md",   label:"10 · Storage/WAL"},
  {file:"lsp-patterns.md",   label:"11 · LSP"},
  {file:"CHANGELOG.md",      label:"12 · Changelog"},
];
const nav = document.getElementById("nav");
nav.innerHTML = PAGES.map((p,i)=>`<a data-i="${i}">${p.label}</a>`).join("");
function show(i){
  const page = PAGES[i];
  document.querySelectorAll("#nav a").forEach(a=>
    a.classList.toggle("active", +a.dataset.i===i));
  const content = document.getElementById("content");
  fetch(page.file)
    .then(r=>{ if(!r.ok) throw 0; return r.text(); })
    .then(md=>{
      content.innerHTML = marked.parse(md);
      content.style.animation = "none";
      void content.offsetWidth;
      content.style.animation = "stampIn .3s ease both";
      document.querySelector(".viewport").scrollTop = 0;
      history.replaceState(null,"","#"+page.file.replace(/\.md$/,""));
    })
    .catch(()=>{ content.innerHTML =
      "<h1 class='nf'>404</h1><blockquote>That page fell behind the desk. Ask Friday.</blockquote>"; });
}
nav.addEventListener("click", e=>{
  const a = e.target.closest("a");
  if(a && a.dataset.i !== undefined) {
    show(+a.dataset.i);
    // close drawer on mobile after selection
    if(window.innerWidth <= 1024) {
      document.querySelector(".sidebar").classList.remove("mobile-open");
    }
  }
});

// toggle drawer on titlebar click for mobile/tablet
document.querySelector(".titlebar").addEventListener("click", ()=>{
  if(window.innerWidth <= 1024) {
    document.querySelector(".sidebar").classList.toggle("mobile-open");
  }
});
const h = location.hash.slice(1);
const start = h ? PAGES.findIndex(p=>p.file.startsWith(h)) : 0;
show(start >= 0 ? start : 0);
</script>
</body>
</html>
