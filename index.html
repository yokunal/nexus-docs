<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS//FRIDAY — Docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f0df;          /* cream paper */
    --paper:#efe6cf;       /* slightly deeper cream for panels */
    --ink:#1c1a17;         /* matte black text */
    --dim:#7a7365;         /* faded gray-brown */
    --heading:#8a3324;     /* burnt brick red — my pick for headings, Boss */
    --green:#2e6e4e;       /* muted forest green for code */
    --line:#d9cdb2;        /* hairline */
    --shadow:#e2d6ba;
    --font:"IBM Plex Mono", "Courier New", monospace;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font); font-size:15px; line-height:1.75;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:var(--bg); border-bottom:2px solid var(--ink);
    padding:14px 28px; display:flex; justify-content:space-between; align-items:baseline; gap:14px;
  }
  header h1{
    margin:0; font-size:17px; letter-spacing:3px; font-weight:700;
    color:var(--ink); text-transform:uppercase;
  }
  header h1 span{color:var(--heading)}   /* //FRIDAY in brick */
  header .status{color:var(--dim); font-size:12px; letter-spacing:1px}
  header .status b{color:var(--heading); font-weight:600}
  .layout{display:grid; grid-template-columns:250px 1fr; min-height:calc(100vh - 52px)}
  nav{
    border-right:2px solid var(--ink); padding:24px 0 40px; background:var(--bg);
  }
  nav .label{
    padding:0 20px; color:var(--dim); font-size:10.5px; letter-spacing:3px;
    margin:8px 0 10px; text-transform:uppercase;
  }
  nav a{
    display:block; padding:6px 20px; color:var(--ink); text-decoration:none;
    border-left:3px solid transparent; font-size:13.5px; cursor:pointer;
    transition:background .12s, transform .12s;
  }
  a:hover, button:hover{transform:translate(-1px,-1px)}
  a:active, button:active{transform:translate(1px,1px)}
  @keyframes stampIn{
    0%{opacity:0; transform:translateY(10px) scale(.96)}
    100%{opacity:1; transform:none}
  }
  @keyframes barSweep{
    from{width:0}
    to{width:100%}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
  }
  nav a:hover{background:var(--paper)}
  nav a.active{border-left-color:var(--heading); color:var(--heading); font-weight:600}
  main{max-width:840px; padding:44px 52px 110px}
  main h1{
    font-size:26px; color:var(--heading); margin:0 0 6px; letter-spacing:.5px;
  }
  main h1::after{
    content:""; display:block; margin-top:12px;
    border-bottom:2px solid var(--ink); width:100%;
  }
  main h1 span.note{color:var(--dim); font-size:13px; font-weight:400; letter-spacing:2px}
  h1 em.note{font-style:normal; color:var(--dim); font-size:12px; letter-spacing:2px; margin-left:8px}
  /* ═══ CHASSIS: terminal-window shell (Swiss Industrial Print) ═══ */
  body{
    display:grid;
    grid-template-columns:220px 1fr;
    grid-template-rows:48px 1fr 34px;
    grid-template-areas:
      "titlebar titlebar"
      "sidebar  viewport"
      "statusbar statusbar";
    height:100vh; overflow:hidden;
  }
  /* ── titlebar with window chrome ── */
  .titlebar{
    grid-area:titlebar;
    display:flex; align-items:center; gap:10px;
    background:var(--ink); color:var(--bg);
    padding:0 14px; border-bottom:2px solid var(--line);
  }
  .titlebar .dots{display:flex; gap:6px}
  .titlebar .dots span{
    width:10px; height:10px; border-radius:50%;
    border:2px solid var(--bg); background:transparent;
  }
  .titlebar .dots span:nth-child(1){background:var(--heading)} /* red */
  .titlebar .dots span:nth-child(2){background:var(--green)}   /* green */
  .titlebar .path{font-size:12px; letter-spacing:1px; opacity:.85}
  .titlebar .rev{
    margin-left:auto; font-size:11px; letter-spacing:2px;
    border:1px solid var(--bg); padding:2px 8px;
  }
  /* ── sidebar: persistent index panel ── */
  .sidebar{
    grid-area:sidebar;
    background:var(--paper);
    border-right:2px dashed var(--line);
    overflow-y:auto; padding:16px 0;
  }
  .sidebar .label{
    font-size:11px; letter-spacing:3px; color:var(--heading);
    padding:0 14px 10px; border-bottom:2px solid var(--line); margin-bottom:10px;
  }
  .sidebar nav a{
    display:block; padding:6px 14px;
    font-size:12.5px; color:var(--ink); text-decoration:none;
    border-left:3px solid transparent;
    transition:background .1s, border-color .1s;
  }
  .sidebar nav a::before{content:"> "; color:var(--dim)}
  .sidebar nav a:hover{background:var(--shadow)}
  .sidebar nav a.active{
    background:var(--ink); color:var(--bg);
    border-left-color:var(--heading);
  }
  .sidebar nav a.active::before{content:"▶ "; color:var(--bg)}
  /* ── viewport: the reading panel with reg marks ── */
  .viewport{
    grid-area:viewport; overflow-y:auto;
    padding:40px 48px; position:relative;
  }
  .viewport::before{ /* register marks, corners */
    content:"+"; position:absolute; top:8px; left:12px;
    color:var(--dim); font-size:12px;
  }
  .viewport::after{
    content:"+"; position:absolute; top:8px; right:12px;
    color:var(--dim); font-size:12px;
  }
  .viewport .cursor{
    display:inline-block; width:9px; height:16px;
    background:var(--green); vertical-align:-2px;
    animation:blink 1.1s steps(1) infinite;
    margin-left:4px;
  }
  @keyframes blink{50%{opacity:0}}
  .viewport main{max-width:760px}
  /* diagonal hatch divider */
  main hr{
    border:0; height:8px; margin:2rem 0;
    background:repeating-linear-gradient(45deg,
      var(--line) 0 1px, transparent 1px 6px);
  }
  /* marginalia-style list markers */
  main li::marker{color:var(--heading)}
  main h2{
    display:flex; align-items:baseline; gap:10px;
  }
  main h2 .sec-num{
    color:var(--dim); font-size:12px; letter-spacing:2px;
  }
  /* ── statusbar ── */
  .statusbar{
    grid-area:statusbar;
    display:flex; align-items:center; gap:18px;
    background:var(--paper); border-top:2px solid var(--line);
    padding:0 14px; font-size:11px; letter-spacing:1.5px; color:var(--dim);
  }
  .statusbar .lamp{
    width:8px; height:8px; border-radius:50%;
    background:var(--green);
    animation:blink 2.4s steps(1) infinite;
  }
  .statusbar .right{margin-left:auto; color:var(--ink)}
  /* ── typewritten stamp for content load ── */
  main{animation:stampIn .3s ease both}
  @media(max-width:820px){
    body{
      grid-template-columns:1fr;
      grid-template-rows:48px 44px 1fr 34px;
      grid-template-areas:
        "titlebar" "sidebar" "viewport" "statusbar";
      height:100vh;
    }
    .sidebar{
      border-right:0; border-bottom:2px dashed var(--line);
      display:flex; overflow-x:auto; padding:0;
      align-items:stretch;
    }
    .sidebar .label{display:none}
    .sidebar nav{display:flex}
    .sidebar nav a{white-space:nowrap; border-left:0; border-bottom:3px solid transparent}
    .sidebar nav a.active{border-bottom-color:var(--heading)}
    .sidebar nav a::before{content:""}
    .viewport{padding:24px 18px}
  }
  main h2{
    font-size:19px; color:var(--heading); margin-top:40px;
  }
  main h2::before{content:"§ "; color:var(--dim); font-weight:400}
  main h3{font-size:15.5px; color:var(--ink); margin-top:26px}
  main h3::before{content:"### "; color:var(--dim); font-weight:400}
  main strong{color:var(--heading); font-weight:600}
  main em{color:var(--dim)}
  main a{color:var(--green); text-decoration:underline; text-underline-offset:3px}
  main ul,main ol{padding-left:22px}
  main li{margin:5px 0}
  main hr{border:none; border-top:1px dashed var(--dim); margin:38px 0; opacity:.5}
  main code{
    background:var(--paper); border:1px solid var(--line); color:var(--green);
    padding:2px 6px; font-size:12.5px;
  }
  main pre{
    background:var(--paper); border:1px solid var(--line);
    border-left:3px solid var(--heading);
    padding:16px 18px; overflow-x:auto; font-size:13px; line-height:1.55;
  }
  main pre code{background:none; border:none; color:var(--ink)}
  main table{border-collapse:collapse; width:100%; margin:18px 0; font-size:13px}
  main th{
    background:var(--ink); color:var(--bg); text-align:left;
    padding:8px 12px; border:1px solid var(--ink); letter-spacing:.5px;
  }
  main td{border:1px solid var(--ink); padding:7px 12px; background:var(--bg)}
  main tr:nth-child(even) td{background:var(--paper)}
  main blockquote{
    margin:18px 0; padding:10px 18px;
    border-left:3px solid var(--ink); background:var(--paper); color:var(--dim);
    font-style:italic;
  }
  main blockquote p{margin:4px 0}
  /* retired: flow-mode footer (replaced by statusbar chassis) */
  footer b{color:var(--heading)}
  @media(max-width:820px){
    .layout{grid-template-columns:1fr}
    nav{border-right:none; border-bottom:2px solid var(--ink);
      display:flex; flex-wrap:wrap; gap:2px; padding:10px}
    nav .label{display:none}
    nav a{border-left:none; border-radius:0; padding:5px 10px}
    nav a.active{border-left:none; font-weight:700}
    main{padding:28px 20px 70px}
  }
  @media print{
    .titlebar,.sidebar,.statusbar{display:none}
    body{display:block; height:auto; overflow:visible}
    .viewport{padding:0}
  }
</style>
</head>
<body>
<div class="titlebar">
  <div class="dots"><span></span><span></span><span></span></div>
  <span class="path">nexus://friday/docs — paper-frame</span>
  <span class="rev">REV 5</span>
</div>
<div class="sidebar">
  <div class="label">— INDEX —</div>
  <nav id="nav"></nav>
</div>
<div class="viewport">
  <main id="content"><p style="color:var(--dim)">loading…<span class="cursor"></span></p></main>
</div>
<div class="statusbar">
  <span class="lamp"></span>
  <span>ON-LINE</span>
  <span>handcrafted · <b>Friday</b> for <b>Boss</b></span>
  <span class="right">paper edition · est. 2025</span>
</div>
<script src="marked.min.js"></script>
<script>
const PAGES = [
  {file:"overview.md",       label:"01 · Overview"},
  {file:"personality.md",    label:"02 · Personality"},
  {file:"architecture.md",   label:"03 · Architecture"},
  {file:"tools.md",          label:"04 · Tools"},
  {file:"workflows.md",      label:"05 · Workflows"},
  {file:"memory.md",         label:"06 · Memory"},
  {file:"subagents.md",      label:"07 · Subagents"},
  {file:"plugins.md",        label:"08 · Plugins"},
  {file:"error-handling.md", label:"09 · Errors"},
  {file:"storage-spec.md",   label:"10 · Storage/WAL"},
  {file:"lsp-patterns.md",   label:"11 · LSP"},
  {file:"CHANGELOG.md",      label:"12 · Changelog"},
];
const nav = document.getElementById("nav");
nav.innerHTML = PAGES.map((p,i)=>`<a data-i="${i}">${p.label}</a>`).join("");
function show(i){
  const page = PAGES[i];
  document.querySelectorAll("nav a").forEach(a=>
    a.classList.toggle("active", +a.dataset.i===i));
  const content = document.getElementById("content");
  fetch(page.file)
    .then(r=>{ if(!r.ok) throw 0; return r.text(); })
    .then(md=>{
      content.innerHTML = marked.parse(md);
      // stamp-in reveal for main blocks + staggered section sweep
      content.style.animation = "none";
      void content.offsetWidth;
      content.style.animation = "stampIn .35s ease both";
      window.scrollTo({top:0});
      history.replaceState(null,"","#"+page.file.replace(/\.md$/,""));
    })
    .catch(()=>{ document.getElementById("content").innerHTML =
      "<h1>404</h1><blockquote>That page fell behind the desk. Ask Friday.</blockquote>"; });
}
nav.addEventListener("click", e=>{
  if(e.target.dataset.i) show(+e.target.dataset.i);
});
const h = location.hash.slice(1);
const start = h ? PAGES.findIndex(p=>p.file.startsWith(h)) : 0;
show(start >= 0 ? start : 0);
</script>
</body>
</html>
